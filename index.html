<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wassim Cheref — Information Systems & Digital Products</title>
  <meta name="description" content="Portfolio of Wassim Cheref: information systems, business analysis, digital products and applied AI.">
  <meta name="theme-color" content="#090c13">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <a class="skip-link" href="#main" data-i="skip"></a>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="glyph-outline" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceGraphic" operator="dilate" radius="1" result="expanded"></feMorphology>
        <feComposite in="expanded" in2="SourceGraphic" operator="out"></feComposite>
      </filter>
    </defs>
  </svg>
  <div id="bar" aria-hidden="true"></div>
  <div id="glow" aria-hidden="true"></div>

  <header id="hd">
    <a class="brand" href="#top" aria-label="Wassim Cheref — Home">W<i>/</i>C</a>
    <nav id="nav" aria-label="Primary navigation">
      <a href="#work" data-i="n1"></a>
      <a href="#projects" data-i="n2"></a>
      <a href="#about" data-i="n3"></a>
      <a href="#intelligence" data-i="n4"></a>
      <a href="#skills" data-i="n5"></a>
    </nav>
    <div class="ctl">
      <button id="lang" type="button" aria-label="Switch language">FR</button>
      <button id="theme" type="button" aria-label="Switch color theme" aria-pressed="false"><span aria-hidden="true">◐</span></button>
      <a class="pill" href="#contact" data-i="n6"></a>
      <button id="menu" type="button" aria-label="Open navigation" aria-controls="nav" aria-expanded="false"><span></span><span></span></button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="hc">
        <p class="eyebrow badge"><b aria-hidden="true"></b><span data-i="open"></span></p>
        <p class="hero-identity"><strong>Wassim Cheref</strong><span data-i="identity_role"></span></p>
        <h1 id="hero-title"><span data-i="h1"></span><br><span id="word" class="grad"></span></h1>
        <p class="lede" data-i="lede"></p>
        <div class="cta">
          <a class="btn p" href="#work" data-i="cta"></a>
          <a class="btn" id="hero-github" href="https://github.com/xwassim" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        </div>
        <div class="stats" id="stats" aria-label="Portfolio highlights"></div>
      </div>

      <div class="hv" id="hv" aria-hidden="true">
        <div class="system-aura"></div>
        <svg class="system-lines" viewBox="0 0 600 640" focusable="false">
          <defs>
            <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6d7cff"/>
              <stop offset=".55" stop-color="#2fd5ff"/>
              <stop offset="1" stop-color="#ffb25b"/>
            </linearGradient>
          </defs>
          <g class="base-lines">
            <path d="M300 320 C300 230 300 160 300 82"/>
            <path d="M300 320 C245 265 188 230 116 210"/>
            <path d="M300 320 C370 270 424 235 492 202"/>
            <path d="M300 320 C228 362 186 408 132 470"/>
            <path d="M300 320 C366 372 425 408 486 466"/>
            <path d="M300 320 C300 408 300 486 300 562"/>
            <path d="M116 210 C168 318 188 392 132 470"/>
            <path d="M492 202 C435 316 430 392 486 466"/>
          </g>
          <g class="flow-lines">
            <path pathLength="1" d="M300 82 C300 160 300 230 300 320"/>
            <path pathLength="1" d="M116 210 C188 230 245 265 300 320"/>
            <path pathLength="1" d="M132 470 C186 408 228 362 300 320"/>
            <path pathLength="1" d="M300 320 C370 270 424 235 492 202"/>
            <path pathLength="1" d="M300 320 C366 372 425 408 486 466"/>
            <path pathLength="1" d="M300 320 C300 408 300 486 300 562"/>
          </g>
        </svg>
        <div class="system-node node-business"><span>Business</span></div>
        <div class="system-node node-process"><span>Process</span></div>
        <div class="system-node node-users"><span>Users</span></div>
        <div class="system-node node-core"><span>Wassim Cheref</span><small data-i="core_system"></small></div>
        <div class="system-node node-data"><span>Data</span></div>
        <div class="system-node node-ai"><span data-i="node_ai"></span></div>
        <div class="system-node node-tech"><span>Tech</span></div>
        <span class="orbit-label orbit-ux">UX</span>
        <span class="orbit-label orbit-bi">BI</span>
        <span class="orbit-label orbit-erp">ERP</span>
        <span class="orbit-label orbit-flow">Workflow</span>
        <span class="orbit-label orbit-gov">Governance</span>
        <span class="orbit-label orbit-auto">Automation</span>
        <p class="system-caption">Business need <span>→</span> process <span>→</span> data <span>→</span> system <span>→</span> users</p>
      </div>
    </section>

    <section class="work-transition" id="work-intro" aria-label="Selected work introduction">
      <div class="transition-pin rv">
        <div class="transition-orbit" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <p class="section-kicker" data-i="work_kicker"></p>
        <h2><span data-i="selected_a"></span><span data-i="selected_b" data-outline aria-hidden="true"></span></h2>
        <p data-i="selected_note"></p>
      </div>
    </section>

    <section class="featured" id="work" aria-labelledby="featured-title">
      <div class="section-head rv">
        <div>
          <p class="section-kicker" data-i="featured_kicker"></p>
          <h2 id="featured-title" data-i="featured_h"></h2>
        </div>
        <p class="sub" data-i="featured_p"></p>
      </div>
      <div id="featured"></div>
    </section>

    <div class="band" aria-hidden="true"><div class="row" id="r1"></div><div class="row rev" id="r2"></div></div>

    <section id="projects" aria-labelledby="projects-title">
      <div class="section-head rv">
        <div>
          <p class="section-kicker" data-i="projects_kicker"></p>
          <h2 id="projects-title" data-i="projects_h"></h2>
        </div>
        <p class="sub" data-i="projects_p"></p>
      </div>
      <div class="filters rv" id="flt" aria-label="Project filters"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="about" class="two method" aria-labelledby="about-title">
      <div class="stick rv">
        <p class="section-kicker" data-i="about_kicker"></p>
        <h2 id="about-title" data-i="ah"></h2>
        <p class="sub" data-i="ap1"></p>
        <p class="sub" data-i="ap2"></p>
        <!-- Optional future portrait slot: add an image and remove hidden when a verified portrait is available. -->
        <figure class="about-portrait" hidden></figure>
        <div class="facts" id="facts"></div>
      </div>
      <div class="method-track">
        <div class="method-line" aria-hidden="true"><i id="method-progress"></i></div>
        <ol class="steps" id="steps"></ol>
      </div>
    </section>

    <section id="intelligence" class="ai-section" aria-labelledby="ai-title">
      <div class="ai-copy rv">
        <p class="section-kicker" data-i="ai_kicker"></p>
        <h2 id="ai-title" data-i="ai_h"></h2>
        <p class="sub ai-quote" data-i="ai_p"></p>
        <p class="ai-mode-label" data-i="ai_applied"></p>
        <div class="ai-domains" id="ai-domains"></div>
      </div>
      <div class="rag-wrap rv">
        <p class="ai-mode-label" data-i="ai_pipeline"></p>
        <div class="rag-pipeline" id="rag-pipeline" aria-label="RAG information flow"></div>
      </div>
      <div class="ai-interests rv">
        <div class="ai-interests-copy">
          <p class="section-kicker" data-i="ai_interests_kicker"></p>
          <h3 data-i="ai_interests_h"></h3>
          <p data-i="ai_interests_p"></p>
        </div>
        <div class="ai-interest-grid" id="ai-interests"></div>
      </div>
    </section>

    <section id="skills" aria-labelledby="skills-title">
      <div class="section-head rv">
        <div>
          <p class="section-kicker" data-i="skills_kicker"></p>
          <h2 id="skills-title" data-i="sh"></h2>
        </div>
        <p class="sub" data-i="sp"></p>
      </div>
      <div class="skills" id="sk"></div>
    </section>

    <section id="community" aria-labelledby="community-title">
      <div class="section-head rv">
        <div>
          <p class="section-kicker" data-i="community_kicker"></p>
          <h2 id="community-title" data-i="ch"></h2>
        </div>
        <p class="sub" data-i="cp"></p>
      </div>
      <div class="comm" id="cm"></div>
    </section>

    <section id="education" class="two" aria-labelledby="education-title">
      <div class="stick rv">
        <p class="section-kicker" data-i="education_kicker"></p>
        <h2 id="education-title" data-i="eh"></h2>
        <p class="sub" data-i="ep"></p>
      </div>
      <div><div class="tl" id="tl"></div><div class="certs" id="ct" hidden></div></div>
    </section>

    <section id="contact" class="ct" aria-labelledby="contact-title">
      <p class="section-kicker rv" data-i="contact_kicker"></p>
      <h2 id="contact-title" class="contact-display rv"><span data-i="contact_a"></span><span data-i="contact_b" data-outline aria-hidden="true"></span><span data-i="contact_c"></span></h2>
      <p class="sub rv" data-i="kp"></p>
      <div class="links rv" id="contact-links"></div>
    </section>
  </main>

  <footer><span>Wassim Cheref © 2026</span><span data-i="foot"></span></footer>

  <div id="md" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="bk" data-x></div>
    <div class="pn" role="document" tabindex="-1">
      <button class="x" type="button" data-x aria-label="Close case study">×</button>
      <div class="stg"><div id="mm"></div><div id="th"></div></div>
      <div class="inf" id="mi"></div>
    </div>
  </div>

  <noscript><p class="noscript">This portfolio needs JavaScript for language switching, project galleries and case studies.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
